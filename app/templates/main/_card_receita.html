<a href="{{ url_for('comentarios.detalhe', id=receita.id) }}"
   class="card recipe-card h-100 text-decoration-none">
  {% if receita.imagem %}
    <img class="recipe-card-img" src="{{ url_for('static', filename=receita.imagem) }}"
         alt="{{ receita.titulo }}" loading="lazy">
  {% else %}
    <div class="recipe-card-img" role="img" aria-label="Imagem indisponível para {{ receita.titulo }}"></div>
  {% endif %}
  <div class="card-body">
    <h2 class="card-title recipe-card-title h5">{{ receita.titulo }}</h2>
    <p class="card-text">{{ receita.descricao }}</p>
    <hr>
    <div class="d-flex flex-wrap justify-content-between gap-2">
      <span class="recipe-card-meta">{{ receita.tempo_min }} min</span>
      <span class="recipe-card-meta">dificuldade {{ receita.dificuldade }}</span>
    </div>
    <span class="capa-abrir">Abrir a receita</span>
  </div>
</a>
